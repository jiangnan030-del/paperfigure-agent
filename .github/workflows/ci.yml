name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Smoke render
        run: paperfig render examples/specs/grouped_bar.yaml --output runs/ci
      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smoke-render
          path: runs/ci
