name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Smoke complete deterministic workflow
        shell: bash
        run: |
          set -euo pipefail
          for spec in examples/specs/*.yaml; do
            name="$(basename "${spec}" .yaml)"
            output="runs/ci/${name}"
            paperfig render "${spec}" --output "${output}"
            paperfig audit "${spec}" --artifacts "${output}"
            (
              cd "${output}"
              python figure.py
            )
            paperfig review "${output}"
            paperfig compare "${output}" "${output}" \
              --output "runs/ci/comparisons/${name}" --fail-on warning
            paperfig package "${output}" \
              --output "runs/ci/packages/${name}.submission.zip" --approve
          done
      - name: Record and enforce visual regression baselines
        shell: bash
        run: |
          set -euo pipefail
          for spec in examples/specs/*.yaml; do
            name="$(basename "${spec}" .yaml)"
            paperfig regress "${spec}" --update --baselines runs/ci/baselines
            if [ -f "tests/baselines/${name}.baseline.json" ]; then
              paperfig regress "${spec}" \
                --baselines tests/baselines --fail-on warning
            fi
          done
      - name: Publish first baseline payload to this pull request
        if: >-
          github.event_name == 'pull_request' &&
          hashFiles('tests/baselines/*.baseline.json') == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -czf /tmp/paperfig-baselines.tar.gz -C runs/ci baselines
          {
            echo '<!-- paperfig-baseline-bootstrap -->'
            echo 'CI_BASELINES_TAR_GZ_BASE64'
            echo '```text'
            base64 -w 76 /tmp/paperfig-baselines.tar.gz
            echo '```'
          } > /tmp/paperfig-baselines-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file /tmp/paperfig-baselines-comment.md
      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smoke-renders
          path: runs/ci
