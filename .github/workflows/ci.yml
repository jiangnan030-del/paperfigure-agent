name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Smoke render all supported marks
        shell: bash
        run: |
          set -euo pipefail
          for spec in examples/specs/*.yaml; do
            name="$(basename "${spec}" .yaml)"
            paperfig render "${spec}" --output "runs/ci/${name}"
          done
      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smoke-renders
          path: runs/ci
